---
# yamllint disable rule:truthy
name: Test action
on:
  pull_request:
    paths:
      - .github/workflows/test.yaml
      - action.yaml


jobs:

  jfrog-setup-internal-auth:
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: exec jfrog-setup
        id: actual
        uses: ./
        with:
          vaultUrl: https://vault.staging.sonar.build:8200
          artifactoryRoleSuffix: test
      - name: validate
        shell: bash
        run: jfrog rt ping

  jfrog-setup-external-auth:
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: get secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # 3.4.0
        with:
          url: https://vault.staging.sonar.build:8200
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-test access_token | jf_access_token;
      - name: exec jfrog-setup
        id: actual
        uses: ./
        with:
          jfrogAccessToken: ${{ fromJSON(steps.secrets.outputs.vault).jf_access_token }}
      - name: validate
        shell: bash
        run: jfrog rt ping
